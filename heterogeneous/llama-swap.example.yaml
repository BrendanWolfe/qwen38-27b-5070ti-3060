# llama-swap model entries for the heterogeneous RTX 5070 Ti + RTX 3060 setup.
# Merge into ~/.config/llama-swap/config.yaml under `models:` (mind the
# two-space indent). llama-swap supplies ${PORT}, owns the process lifecycle,
# and records per-request metrics (the launchers enable vLLM's usage and
# per-request-metrics flags). NO_API_KEY=1 disables vLLM's key auth because
# llama-swap is the trusted front door; keep llama-swap itself off untrusted
# networks. The unprefixed IDs can be kept as aliases for older clients.
#
# models:
  "vllm-speed/qwen3.8-27b-batch":
    name: "Qwen3.8 27B batch (vLLM, RTX 5070 Ti + RTX 3060)"
    description: "General 147k FP8-KV/MTP batch profile (8 slots); frozen launcher snapshot."
    aliases:
      - "vllm-speed/qwen3.8-27b"
      - "qwen3.8-27b"
      - "qwen-local"
    useModelName: "qwen3.8-27b"
    cmd: |
      /usr/bin/env PORT='${PORT}' NO_API_KEY=1 \
      /mnt/ssd1/qwen38-27b-rtx3090/heterogeneous/start_qwen_batch.sh
    checkEndpoint: /health
    ttl: 900
    unloadTimeout: 60
  "vllm-speed/qwen3.8-27b-dflash2-batch":
    name: "Qwen3.8 27B DFlash2 batch (147k KVarN)"
    description: "Four-seat DFlash2 with KVarN 4/2 KV: 147,456 context in a 151,503-token pool."
    aliases:
      - "qwen3.8-27b-dflash2-batch"
    useModelName: "qwen3.8-27b"
    cmd: |
      /usr/bin/env PORT='${PORT}' NO_API_KEY=1 \
      /mnt/ssd1/qwen38-27b-rtx3090/heterogeneous/start_qwen_dflash2_batch.sh
    checkEndpoint: /health
    ttl: 900
    unloadTimeout: 60
  "vllm-speed/qwen3.8-27b-dflash2-solo":
    name: "Qwen3.8 27B DFlash2 solo (200k KVarN)"
    description: "Single-stream DFlash2 with KVarN 4/2 KV: 200,192 context in a 202,174-token pool."
    aliases:
      - "qwen3.8-27b-dflash2-solo"
    useModelName: "qwen3.8-27b"
    cmd: |
      /usr/bin/env PORT='${PORT}' NO_API_KEY=1 \
      /mnt/ssd1/qwen38-27b-rtx3090/heterogeneous/start_qwen_dflash2_solo.sh
    checkEndpoint: /health
    ttl: 900
    unloadTimeout: 60
  "vllm-speed/qwen3.8-27b-solo":
    name: "Qwen3.8 27B 262k solo (single stream, full native context)"
    description: "KVarN 4-bit-key/2-bit-value KV at ONE scheduler slot: 296,974-token pool at the full 262,144 context, at the batch profile's decode rate. Serves one request at a time."
    aliases:
      - "qwen3.8-27b-solo"
    useModelName: "qwen3.8-27b"
    cmd: |
      /usr/bin/env PORT='${PORT}' NO_API_KEY=1 \
      /mnt/ssd1/qwen38-27b-rtx3090/heterogeneous/start_qwen_solo.sh
    checkEndpoint: /health
    ttl: 900
    unloadTimeout: 60
